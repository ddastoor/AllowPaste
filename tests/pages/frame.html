<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AllowPaste test frame</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: .5rem; }
  input { width: 100%; box-sizing: border-box; padding: .4rem; font: inherit; }
</style>
</head>
<body>
<input id="framed" type="password" autocomplete="off" placeholder="Paste is blocked here">
<script>
  window.blocked = 0;
  document.getElementById("framed").addEventListener("paste", (e) => { e.preventDefault(); window.blocked++; });
</script>
</body>
</html>
