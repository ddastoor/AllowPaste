<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AllowPaste test page</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; color: #202124; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  small { display: block; font-weight: 400; color: #5f6368; }
  input { width: 100%; box-sizing: border-box; padding: .4rem; font: inherit; }
  iframe { width: 100%; height: 6rem; border: 1px dashed #9aa0a6; }
  #log { margin-top: 1.5rem; padding: .5rem; background: #f1f3f4; white-space: pre-wrap; min-height: 2rem; }
</style>
</head>
<body>
<h1>AllowPaste test page</h1>
<p>Each field below blocks paste the way some real sites do. Copy some text, try
pasting into each field, then click the AllowPaste icon (or press Alt+Shift+V)
and try again.</p>

<label>Not blocked (for comparison)
  <input id="plain" type="password" autocomplete="off"></label>

<label>Inline <code>onpaste="return false"</code>
  <input id="inline" type="password" autocomplete="off" onpaste="return false"></label>

<label>Paste listener on the field
  <input id="listener" type="password" autocomplete="off"></label>

<label>Paste listener on the whole page
  <small>(document, capture phase)</small>
  <input id="document" type="password" autocomplete="off"></label>

<label>Ctrl+V / Cmd+V / Shift+Insert blocked
  <small>(right-click &rarr; Paste still works here without AllowPaste)</small>
  <input id="keys" type="password" autocomplete="off"></label>

<label>Ctrl+V / Cmd+V / Shift+Insert blocked for the whole page
  <small>(one keyboard listener on the page, in the capture phase, as some bank sites do)</small>
  <input id="page-keys" type="password" autocomplete="off"></label>

<label>Paste input cancelled
  <small>(beforeinput)</small>
  <input id="beforeinput" type="password" autocomplete="off"></label>

<label>Framework-style field
  <small>(the site keeps its own copy of the value from "input" events, like React does: <span id="framework-value">empty</span>)</small>
  <input id="framework" type="password" autocomplete="off"></label>

<label>Field inside a shadow root
  <paste-blocking-field id="shadow-host"></paste-blocking-field></label>

<label>Field inside a frame from this same site
  <iframe id="same-origin-frame" src="frame.html" title="same-site frame"></iframe></label>

<label>Field inside a frame from another site
  <small>(AllowPaste can't reach this one: the click only lets it into this page's own site)</small>
  <iframe id="cross-origin-frame" title="other-site frame"></iframe></label>

<p>The right-click menu is also blocked on this page (try right-clicking anywhere).</p>

<div id="log" aria-live="polite"></div>

<script>
  const log = (msg) => { document.getElementById("log").textContent += msg + "\n"; };
  const byId = (id) => document.getElementById(id);
  window.blocked = {};  // counts what the page managed to block, for the tests
  const count = (what) => { window.blocked[what] = (window.blocked[what] || 0) + 1; log("Blocked: " + what); };

  // Inline handler: count it too (the attribute above does the blocking).
  byId("inline").addEventListener("paste", () => count("inline"));

  byId("listener").addEventListener("paste", (e) => { e.preventDefault(); count("listener"); });

  document.addEventListener("paste", (e) => {
    if (e.target.id === "document") { e.preventDefault(); count("document"); }
  }, true);

  const isPasteKey = (e) => ((e.key === "v" || e.key === "V") && (e.ctrlKey || e.metaKey)) ||
                            (e.key === "Insert" && e.shiftKey);

  byId("keys").addEventListener("keydown", (e) => {
    if (isPasteKey(e)) { e.preventDefault(); count("keys"); }
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.id === "page-keys" && isPasteKey(e)) { e.preventDefault(); count("page-keys"); }
  }, true);

  byId("beforeinput").addEventListener("beforeinput", (e) => {
    if (e.inputType.startsWith("insertFromPaste")) { e.preventDefault(); count("beforeinput"); }
  });

  window.frameworkValue = "";
  byId("framework").addEventListener("input", (e) => {
    window.frameworkValue = e.target.value;
    byId("framework-value").textContent = e.target.value ? e.target.value.length + " characters" : "empty";
  });
  byId("framework").addEventListener("paste", (e) => { e.preventDefault(); count("framework"); });

  customElements.define("paste-blocking-field", class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: "open" });
      root.innerHTML = '<input id="inner" type="password" autocomplete="off" style="width:100%;box-sizing:border-box;padding:.4rem;font:inherit">';
      root.getElementById("inner").addEventListener("paste", (e) => { e.preventDefault(); count("shadow"); });
    }
  });

  document.addEventListener("contextmenu", (e) => { e.preventDefault(); count("contextmenu"); });

  // The same frame page, from the other name of this computer, is another site.
  const other = location.hostname === "localhost" ? "127.0.0.1" : "localhost";
  byId("cross-origin-frame").src = `${location.protocol}//${other}:${location.port}/frame.html`;
</script>
</body>
</html>
